name: Pages (Browser-Version)
on:
  push: { branches: [main, ccr-c83759b9-34xxzv], tags: ['v*'] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Build (Pages-Unterpfad)
        run: npm run build -w @nam/web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DEFAULT_SERVER: ${{ vars.NAM_SERVER_URL }}
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
