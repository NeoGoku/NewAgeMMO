name: Release (APK + PWA)
on:
  push: { branches: [main], tags: ['v*'], paths: ['apps/**', 'packages/**', 'database/**', 'package-lock.json'] }
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Web-Build (APK, relative Pfade)
        run: npm run build -w @nam/web
        env: { VITE_DEFAULT_SERVER: '${{ vars.NAM_SERVER_URL }}' }
      - name: Persistenten Android-Debugschlüssel bereitstellen
        env:
          NAM_ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.NAM_ANDROID_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [[ -n "$NAM_ANDROID_DEBUG_KEYSTORE_B64" ]]; then
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$NAM_ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "::warning::Ohne persistenten Android-Signierschlüssel erfordert eine abweichend signierte APK eine Migration per Solo-Backup."
          fi
      - name: Android-Projekt erzeugen und Debug-APK bauen
        working-directory: apps/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node prepare.mjs
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Artefakte benennen
        run: |
          V="${GITHUB_REF_NAME}"; case "$V" in v*) ;; *) V="v0.2.${{ github.run_number }}";; esac; echo "VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p out && cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk "out/NewAgeMMO-${V}.apk"
          (cd apps/web/dist && zip -qr "../../../out/NewAgeMMO-web-${V}.zip" .)
      - uses: actions/upload-artifact@v4
        with: { name: release-files, path: out/* }
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: NewAgeMMO ${{ env.VERSION }}
          files: out/*
          generate_release_notes: true
          body: |
            **Download:** `NewAgeMMO-*.apk` (Android, Debug-signiert – „Unbekannte Apps“ erlauben). Vor einem APK-Wechsel mit anderer Signatur den Solo-Spielstand exportieren. Browser/Windows-PWA: siehe README.
