name: Release (APK + PWA)
on:
  push: { branches: [main], tags: ['v*'], paths: ['apps/**', 'packages/**', 'database/**', 'package-lock.json'] }
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: public-release, cancel-in-progress: false }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Web-Build (APK, relative Pfade)
        run: npm run build -w @nam/web
        env: { VITE_DEFAULT_SERVER: '${{ vars.NAM_SERVER_URL }}' }
      - name: Release-Version und Web-ZIP
        run: |
          V="${GITHUB_REF_NAME}"; case "$V" in v*) ;; *) V="v0.2.${{ github.run_number }}";; esac
          echo "VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p out
          (cd apps/web/dist && zip -qr "../../../out/NewAgeMMO-web-${V}.zip" .)
      - name: Android-Signierung prüfen
        id: android
        env:
          NAM_ANDROID_KEYSTORE_B64: ${{ secrets.NAM_ANDROID_KEYSTORE_B64 }}
          NAM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NAM_ANDROID_KEYSTORE_PASSWORD }}
          NAM_ANDROID_CERT_SHA256: ${{ vars.NAM_ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          if [[ -n "$NAM_ANDROID_KEYSTORE_B64" && -n "$NAM_ANDROID_KEYSTORE_PASSWORD" && -n "$NAM_ANDROID_CERT_SHA256" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dauerhafte Android-Signierung fehlt. Nur das Web-ZIP wird veröffentlicht."
          fi
      - name: Android-Projekt erzeugen und Release-APK bauen
        if: steps.android.outputs.enabled == 'true'
        working-directory: apps/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node prepare.mjs
          npx cap sync android
          cd android && ./gradlew assembleRelease --no-daemon
      - name: APK signieren und Zertifikat prüfen
        if: steps.android.outputs.enabled == 'true'
        env:
          NAM_ANDROID_KEYSTORE_B64: ${{ secrets.NAM_ANDROID_KEYSTORE_B64 }}
          NAM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NAM_ANDROID_KEYSTORE_PASSWORD }}
          NAM_ANDROID_CERT_SHA256: ${{ vars.NAM_ANDROID_CERT_SHA256 }}
        run: |
          bash apps/android/sign-release.sh \
            apps/android/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "out/NewAgeMMO-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: release-files, path: out/* }
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: NewAgeMMO ${{ env.VERSION }}
          make_latest: ${{ steps.android.outputs.enabled }}
          files: out/*
          generate_release_notes: true
          body: |
            ${{ steps.android.outputs.enabled == 'true' && 'Android-APK mit geprüftem dauerhaftem Signierschlüssel. Beim einmaligen Wechsel von einer älteren Debug-APK zuerst den Solo-Spielstand exportieren.' || 'Web-Release. Die Android-APK folgt, sobald der dauerhafte Signierschlüssel eingerichtet ist.' }}
            Browser und Windows-PWA sind über GitHub Pages verfügbar.
